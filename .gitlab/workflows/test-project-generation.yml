# Check that creating a new project using the template works.
# This includes running prek and pytest on the created project.
.test_project_generation_base:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  variables:
    PROJECT_DIR: python-template-example
  before_script:
    - uv venv
    - uv tool install copier --with jinja2-shell-extension --with copier-templates-extensions
  script:
    - set -x
    - export PATH="/root/.local/bin:$PATH"
    - git config --global user.name "${GIT_NAME:-Python Template}"
    - git config --global user.email "python-template@tudelft.nl"
    - >
      if [ "${ENV_MANAGER:-uv}" == "pixi" ]; then
        curl -fsSL https://pixi.sh/install.sh | bash
        export PATH="/root/.pixi/bin:$PATH"
      fi
    - >
        copier copy
        --defaults
        --trust
        --vcs-ref HEAD
        -d project_name=$PROJECT_DIR
        -d environment_manager=${ENV_MANAGER:-uv}
        ${HOST:+-d host=$HOST}
        ${PYTHON_VERSION:+-d min_python_version=$PYTHON_VERSION}
        ${PROJECT_SHORT_DESCRIPTION:+-d project_short_description="$PROJECT_SHORT_DESCRIPTION"}
        . $PROJECT_DIR
    - cd $PROJECT_DIR

    - if [ "${ENV_MANAGER:-uv}" == "uv" ]; then uv run pytest; fi
    - if [ "${ENV_MANAGER:-uv}" == "uv" ]; then uv run zensical build --clean; fi

    - if [ "${ENV_MANAGER:-uv}" == "pixi" ]; then pixi run -e dev pytest; fi
    - if [ "${ENV_MANAGER:-uv}" == "pixi" ]; then pixi run -e dev zensical build --clean; fi

test_project_generation_defaults:
  extends: .test_project_generation_base

test_project_generation:
  extends: .test_project_generation_base
  parallel:
    # Test for uv and pixi with both hosts, also test uv with a different python python version.
    matrix:
      - ENV_MANAGER: uv
        HOST: [gitlab.ewi.tudelft.nl, github.com]
        PYTHON_VERSION: "3.10"
      - ENV_MANAGER: pixi
        HOST: [gitlab.ewi.tudelft.nl, github.com]
        PYTHON_VERSION: "3.10"
      - ENV_MANAGER: uv
        HOST: gitlab.ewi.tudelft.nl
        PYTHON_VERSION: "3.13"

test_project_generation_no_surname:
  extends: .test_project_generation_base
  variables:
    GIT_NAME: "Python-Template-No-Surname"

test_project_generation_long_description:
  extends: .test_project_generation_base
  variables:
    PROJECT_SHORT_DESCRIPTION: "A very long project description that exceeds the typical length limit for project descriptions in the template. This should be more than 120 line length."

# Run prek checks for the project template itself.
test_pre_commit:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  stage: test
  before_script:
    - uv venv
    - uv pip install prek
  script:
    - uv run prek run --all-files
