# Check that creating a new project using the template works.
# This includes running prek and pytest on the created project.
.test_project_generation_base:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  variables:
    ENV_MANAGER: uv
    HOST: gitlab.ewi.tudelft.nl
  before_script:
    - >
      uv tool install copier
      --with jinja2-shell-extension
      --with copier-templates-extensions
      --with giturlparse
    - export PATH="/root/.local/bin:$PATH"
    - git config --global user.name "${GIT_NAME:-Python Template}"
    - git config --global user.email "python-template@tudelft.nl"
    - >
      if [ "$ENV_MANAGER" == "pixi" ]; then
        curl -fsSL https://pixi.sh/install.sh | bash
        export PATH="/root/.pixi/bin:$PATH"
      fi
  script:
    # Copier does not support copying into an empty git repository inside the template repository.
    # Gitlab only cleans up the template repository folder.
    # So we create a separate tmp folder and clean it up ourselves.
    - TEMPLATE_DIR="$PWD"
    - TMP_DIR="$(mktemp -d)"
    - trap 'rm -rf "$TMP_DIR"' EXIT
    - cd "$TMP_DIR"
    - git init
    - git remote add origin "https://$HOST/reit/test-ci.git"

    - >
        copier copy
        --defaults
        --trust
        --vcs-ref HEAD
        -d project_name=python-template-example
        -d environment_manager=$ENV_MANAGER
        ${PYTHON_VERSION:+-d min_python_version=$PYTHON_VERSION}
        ${PROJECT_SHORT_DESCRIPTION:+-d project_short_description="$PROJECT_SHORT_DESCRIPTION"}
        ${LICENSE:+-d license="$LICENSE"}
        "$TEMPLATE_DIR" ./

    - if [ "$ENV_MANAGER" == "uv" ]; then uv run python ./src/python_template_example/main.py; fi
    - if [ "$ENV_MANAGER" == "uv" ]; then uv run pytest; fi
    - if [ "$ENV_MANAGER" == "uv" ]; then uv run zensical build --clean; fi

    - if [ "$ENV_MANAGER" == "pixi" ]; then pixi run python ./src/python_template_example/main.py; fi
    - if [ "$ENV_MANAGER" == "pixi" ]; then pixi run -e dev pytest; fi
    - if [ "$ENV_MANAGER" == "pixi" ]; then pixi run -e dev zensical build --clean; fi

    - uvx cffconvert --validate -i CITATION.cff

test_project_generation_defaults:
  extends: .test_project_generation_base

test_project_generation:
  extends: .test_project_generation_base
  parallel:
    # Test for uv and pixi with both hosts, also test uv with a different python version.
    matrix:
      - ENV_MANAGER: uv
        HOST: [gitlab.ewi.tudelft.nl, github.com]
        PYTHON_VERSION: "3.10"
      - ENV_MANAGER: pixi
        HOST: [gitlab.ewi.tudelft.nl, github.com]
        PYTHON_VERSION: "3.10"
      - ENV_MANAGER: uv
        HOST: gitlab.ewi.tudelft.nl
        PYTHON_VERSION: "3.13"

test_project_generation_existing_repo:
  extends: .test_project_generation_base
  parallel:
    matrix:
      - ENV_MANAGER: [uv, pixi]
        HOST: gitlab.ewi.tudelft.nl
        PYTHON_VERSION: "3.10"
  script:
    - !reference [.test_project_generation_base, script]
    - ls -la # TODO REMOVE
    - |
        cat > src/python_template_example/new-file.py <<'EOF'
        def foo():
          a = 1
          c = 0
          return a
        EOF
    - git add .
    - git commit --no-verify -m "Add new file with linting errors"
    - git status # TODO REMOVE
    - >
        copier copy
        --defaults
        --overwrite
        --trust
        --vcs-ref HEAD
        -d project_name=python-template-example
        -d environment_manager=$ENV_MANAGER
        ${PYTHON_VERSION:+-d min_python_version=$PYTHON_VERSION}
        "$TEMPLATE_DIR" ./
    - if [ "$ENV_MANAGER" == "uv" ]; then uv run pytest; fi
    - if [ "$ENV_MANAGER" == "uv" ]; then uv run zensical build --clean; fi
    - if [ "$ENV_MANAGER" == "pixi" ]; then pixi run -e dev pytest; fi
    - if [ "$ENV_MANAGER" == "pixi" ]; then pixi run -e dev zensical build --clean; fi
    - uvx cffconvert --validate -i CITATION.cff
    - cat src/python_template_example/new-file.py # TODO REMOVE

test_project_generation_no_surname:
  extends: .test_project_generation_base
  variables:
    GIT_NAME: "Python-Template-No-Surname"

test_project_generation_long_description:
  extends: .test_project_generation_base
  variables:
    PROJECT_SHORT_DESCRIPTION: "A very long project description that exceeds the typical length limit for project descriptions in the template. This should be more than 120 line length."

test_project_generation_licenses:
  extends: .test_project_generation_base
  parallel:
    matrix:
      - LICENSE: [GPL, BSD, Apache, MIT, "No license (others may not use, share or modify the code)"]

# Run prek checks for the project template itself.
test_pre_commit:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  stage: test
  before_script:
    - uv venv
    - uv pip install prek
  script:
    - uv run prek run --all-files
