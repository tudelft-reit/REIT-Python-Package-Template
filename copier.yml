# CONFIGURATION -------------------------
_subdirectory: project_template

_skip_if_exists:
  - CHANGELOG.md

_jinja_extensions:
  - jinja2_shell_extension.ShellExtension
  - copier_templates_extensions.TemplateExtensionLoader
  - extensions/context.py:ContextUpdater

# PROMPT --------------------------------
project_name:
  type: str
  help: Please provide the name of your project.
  default: '{{ repo_project_name }}'
  validator: >-
    {% if not project_name %}
      You must provide a name for the project.
    {% elif ' ' in project_name %}
      You must provide a project name without spaces.
    {% endif %}

python_name:
  type: str
  help: The Python package import name (for `import NAME` in Python code)
  default: "{{ project_name|lower|replace('-', '_')|replace(' ', '_') }}"
  when: false  # Hide this question, we just have it to be able to compute the value

full_name:
  type: str
  help: Who's the main person responsible for this code?
  default: "{{ 'git config user.name' | shell() | trim }}"
  validator: >-
    {% if not full_name %} You must provide a name (possibly yours) to place in
    your config files.
    {% elif full_name != (full_name | trim) %}
    Your must provide a name without leading or trailing spaces.
    {% endif %}

email:
  type: str
  help: What's their email?
  default: "{{ 'git config user.email' | shell() | trim }}"
  validator: >-
    {% if not (email | regex_search('^[a-zA-Z0-9.!#$%&’*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$'))
    %}
    You must provide a valid email to place in
    your config files.
    {% endif %}

project_short_description:
  type: str
  help: Write a short description of your project.
  default: A great package.
  validator: >-
    {% if project_short_description != (project_short_description | trim) %}
    Your must provide a description without leading or trailing spaces.
    {% endif %}

license:
  type: str
  help: Select a license
  default: GPL
  choices:
    - GPL
    - BSD
    - Apache
    - MIT
    - No license (others may not use, share or modify the code)

min_python_version:
  type: str
  help: What is the minimum version of Python your project will support? (must be 3.8 or higher)
  default: '3.10'
  validator: >-
    {% if min_python_version != (min_python_version | trim) %}
    Please provide the Python version without leading or trailing spaces.
    {% elif not (min_python_version | regex_search('^3\.[0-9]+(?:\.[0-9]+)?$')) %}
    Please supply a valid Python 3 version in the form 3.X or 3.X.Y (e.g. 3.11 or 3.11.4).
    {% elif (min_python_version.split('.')[1] | int) < 8 %}
    Please supply a minimum Python version of 3.8 or higher.
    {% endif %}

environment_manager:
  type: str
  help: Select which virtual environment manager to use. Choose uv unless you need conda dependencies.
  default: uv
  choices:
    uv   (pip dependencies only) [Recommended]: uv
    pixi (conda and pip dependencies): pixi

_message_after_copy: |
  Your project "{{ project_name }}" has been successfully created in {{ _copier_conf.dst_path }} folder!

      ###################################################
      ---------------------------------------------------
      DO THE FOLLOWING MANUAL STEPS TO FINISH UP THE SETUP
      ---------------------------------------------------
      ###################################################

          {% if _copier_conf.os not in ['linux', 'macos'] and environment_manager=='pixi' -%}
          - Enable running on DAIC/DelftBlue and fix the CI
            Add "linux-64" to the list of platforms in [tool.pixi.project] in the pyproject.toml
            Commit and push
          {%- endif %}

          {%- if host=='gitlab.tudelft.nl' %}
          - Setup a CI runner for your project. See the link below for a tutorial
            https://tu-delft-dcc.github.io/docs/software/automation/gitlab/gitlab_docker.html

          {% endif %}

          {%- if is_new_project -%}
          - Push the initial commit and tag to {{host}}

              git push
              git push --tags
          {%- else -%}
          - Have a look at the diff of each file that was modified and add back any changes that you want to keep.
          {%- endif %}

          - Have a look at the repository README.md file for additional information

_tasks:
  ###
  # uv environment management
  ###
  - command: uv sync
    when: "{{ environment_manager=='uv' }}"
  - command: uv run prek install
    when: "{{ environment_manager=='uv' }}"

  ###
  # pixi environment management
  ##
  - command: pixi init --format pyproject
    when: "{{ environment_manager=='pixi' }}"
  - command: pixi install --all
    when: "{{ environment_manager=='pixi' }}"
  - command: pixi run --environment dev prek install
    when: "{{ environment_manager=='pixi' }}"

  # TODO: implement when flag is added https://github.com/prefix-dev/pixi/issues/5018
  # - command: pixi workspace exclude-newer "1 week"
  #   when: "{{ environment_manager=='pixi' }}"

  ###
  # New repo setup
  ###
  - command: git add --all
    when: '{{ is_new_project }}'

  - command: git commit --message "REIT python template setup"
    when: '{{ is_new_project }}'

  - command: git tag v0.0.1
    when: '{{ is_new_project }}'

  ###
  # Existing repo setup uv
  ###
  - command: uv run ruff format
    when: "{{ not is_new_project and environment_manager=='uv'}}"

  - command: uv run ruff check --add-noqa
    when: "{{ not is_new_project and environment_manager=='uv'}}"

  ###
  # Existing repo setup pixi
  ###
  - command: pixi run --environment dev ruff format
    when: "{{ not is_new_project and environment_manager=='pixi'}}"

  - command: pixi run --environment dev ruff check --add-noqa
    when: "{{ not is_new_project and environment_manager=='pixi'}}"
